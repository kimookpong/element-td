# Element TD 3D บน Cloudflare Workers: ไฟล์เกมจาก dist/ + API ที่ /api/*
name = "element-td"
account_id = "aa1d5f8e2f405d06cd915b83be578612"
main = "worker/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
routes = [{ pattern = "elementtd.thasala.dev", custom_domain = true }]

# build เกม (vite) ก่อน deploy ทุกครั้ง ทั้งจาก wrangler ในเครื่อง, GitHub Actions และ Workers Builds
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "element-td-db"
database_id = "f4139590-bfbf-4250-8916-db4f9774fb12"
migrations_dir = "migrations"

[vars]
# OAuth Client ID (ชนิด Web) จาก Google Cloud Console ใส่แล้ว deploy ใหม่ ปุ่มล็อกอินจะขึ้นเอง
GOOGLE_CLIENT_ID = ""
