name: Deploy to Cloudflare

# ทุกครั้งที่ push ขึ้น main: build เกม, อัปเดตตาราง D1 แล้ว deploy Worker (elementtd.thasala.dev)
# ต้องมี secret CLOUDFLARE_API_TOKEN ใน Settings > Secrets and variables > Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing. Add it in Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply element-td-db --remote
      - name: Deploy Worker
        run: npx wrangler deploy
